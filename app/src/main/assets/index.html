<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0D8691">
<!-- La parte web no tiene acceso a la red (connect-src none): los cupones y los canjes nunca salen por internet. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Surtidor Faustino</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<header class="cab">
  <img src="logo-blanco.png" alt="Hospital Faustino Pérez" class="logo">
  <button class="engranaje" id="b-ajustes" aria-label="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
</header>
<div class="subcab"><b>Surtidor Faustino</b><span id="hospital">Validación de cupones de combustible</span></div>

<main>
  <!-- Inicio -->
  <section id="v-inicio" class="vista">
    <div class="estado" id="estado"></div>
    <div class="actualizar" id="actualizacion" hidden></div>
    <button class="baldosa grande" id="b-escanear"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><rect x="8" y="8" width="3" height="3" rx=".5"/><rect x="13" y="8" width="3" height="3" rx=".5"/><rect x="8" y="13" width="3" height="3" rx=".5"/><path d="M13 13h3v3h-3z"/></svg></span><span class="tx"><b>Escanear cupón</b><small>Apunta la cámara al código QR</small></span></button>
    <button class="baldosa" id="b-teclear"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg></span><span class="tx"><b>Teclear el cupón</b><small>Folio y código a mano</small></span></button>
    <button class="baldosa" id="b-canjes"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3 10 14"/><path d="M21 3 14.5 21l-4.5-7-7-4.5z"/></svg></span><span class="tx"><b>Enviar canjes</b><small>Mandar a la Dirección lo que ya entregaste</small></span><span class="insignia" id="n-canjes" hidden></span></button>
    <button class="baldosa" id="b-cargar"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg></span><span class="tx"><b>Recibir cupones</b><small>Cargar el archivo que te mandó la Dirección</small></span></button>
    <input type="file" id="f-lote" accept=".json,application/json,text/plain,*/*" hidden>
    <p class="version" id="v-version"></p>
  </section>

  <!-- Escáner -->
  <section id="v-escaner" class="vista" hidden>
    <div class="visor"><video id="video" playsinline muted></video><div class="marco"></div></div>
    <p class="ayuda" id="ayuda-escaner">Apunta la cámara al código QR del cupón.</p>
    <button class="gran sec" id="b-cancelar-escaner">Cancelar</button>
  </section>

  <!-- Teclear -->
  <section id="v-teclear" class="vista" hidden>
    <h2>Teclear el cupón</h2>
    <label>Folio<input id="t-folio" type="text" inputmode="text" autocomplete="off" placeholder="COMB-2026-00012  ·  o solo 12" autocapitalize="characters"></label>
    <label>Código<input id="t-codigo" type="text" autocomplete="off" placeholder="K7M2Q-9XPA3" autocapitalize="characters"></label>
    <button class="gran pri" id="b-comprobar">Comprobar</button>
    <button class="gran sec" id="b-cancelar-teclear">Volver</button>
  </section>

  <!-- Resultado -->
  <section id="v-resultado" class="vista" hidden>
    <div id="resultado"></div>
    <button class="gran pri" id="b-entregado" hidden>✔ Ya entregué el combustible</button>
    <button class="gran sec" id="b-siguiente">Siguiente cupón</button>
  </section>

  <!-- Canjes -->
  <section id="v-canjes" class="vista" hidden>
    <h2>Enviar canjes</h2>
    <p class="ayuda" id="resumen-canjes"></p>
    <button class="baldosa grande" id="b-compartir"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3 10 14"/><path d="M21 3 14.5 21l-4.5-7-7-4.5z"/></svg></span><span class="tx"><b>Enviar a la Dirección</b><small>WhatsApp, Bluetooth…</small></span></button>
    <button class="baldosa" id="b-guardar"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg></span><span class="tx"><b>Guardar en el teléfono</b><small>Para enviarlo después</small></span></button>
    <div id="lista-canjes"></div>
    <button class="enlace" id="b-reenviar">Preparar de nuevo todos los canjes</button>
    <button class="gran sec" id="b-volver-canjes">Volver</button>
  </section>

  <!-- Ajustes -->
  <section id="v-ajustes" class="vista" hidden>
    <h2>Ajustes</h2>
    <label>Tu nombre (va en el archivo de canjes)<input id="a-nombre" type="text" autocomplete="off" placeholder="Nombre y apellidos"></label>
    <div class="caja"><b>Llave del hospital</b><span id="a-huella">Todavía no has cargado ningún archivo de cupones.</span></div>
    <div class="caja"><b>Hora del teléfono</b><span id="a-hora"></span></div>
    <div class="caja"><b>Diagnóstico</b><span id="a-diag"></span></div>
    <button class="baldosa" id="b-actualizar"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5m0 0-5 5m5-5 5 5"/></svg></span><span class="tx"><b>Buscar actualización</b><small>Necesita internet</small></span></button>
    <p class="ayuda" id="r-actualizacion"></p>
    <button class="gran sec" id="b-volver-ajustes">Volver</button>
    <button class="enlace peligro" id="b-borrar">Borrar todos los datos de la aplicación</button>
    <p class="version" id="version"></p>
  </section>
</main>

<!-- Aviso emergente -->
<div id="modal" class="modal" hidden><div class="tarjeta"><h3 id="m-titulo"></h3><p id="m-texto"></p><div class="acciones"><button class="sec" id="m-no"></button><button class="pri" id="m-si"></button></div></div></div>
<div id="aviso" class="aviso" hidden></div>

<script src="nacl.min.js"></script>
<script src="jsQR.js"></script>
<script src="nucleo.js"></script>
<script src="app.js"></script>
</body>
</html>
